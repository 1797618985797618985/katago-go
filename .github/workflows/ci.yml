name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: 规则引擎测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 流程校验要和 base 分支比，浅克隆拿不到共同祖先，所以取完整历史
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 语法检查
        run: |
          for f in $(find server public tools -name '*.js' -not -path '*/node_modules/*'); do
            node --check "$f"
          done

      - name: 版本号一致性（package.json / README / CHANGELOG）
        run: node tools/check-version.js

      # 约定：改了代码就必须同步升版本号并更新 README / CHANGELOG。
      # PR 上拿 PR 的 base 分支比；直接推分支时拿 main 比。
      - name: 改动与版本号 / README 同步校验
        env:
          CHECK_SYNC_BASE: origin/${{ github.base_ref || 'main' }}
        run: node tools/check-sync.js

      - name: 规则引擎单元测试
        run: node tools/rules-test.js

      - name: 内置引擎与难度曲线测试
        run: node tools/engine-test.js
