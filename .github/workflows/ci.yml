name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: 规则引擎测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 语法检查
        run: |
          for f in $(find server public tools -name '*.js' -not -path '*/node_modules/*'); do
            node --check "$f"
          done

      - name: 规则引擎单元测试
        run: node tools/rules-test.js

      - name: 内置引擎与难度曲线测试
        run: node tools/engine-test.js

      - name: 实体棋盘回路测试
        run: node tools/hardware-loop-test.js
